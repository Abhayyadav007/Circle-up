[package]
name = "circleup-backend"
version = "0.1.0"
edition = "2021"
publish = false
description = "Circleup API — Axum + SQLx + PostgreSQL, vertical-slice architecture"

[[bin]]
name = "circleup-backend"
path = "src/main.rs"

[lib]
name = "circleup_backend"
path = "src/lib.rs"

[dependencies]
# --- Web framework ---
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "timeout", "util"] }
hyper = "1"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Database ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Auth ---
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"

# --- Storage (Cloudflare R2 / S3-compatible) ---
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = "1"

# --- HTTP client (Google OAuth token verification) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- Config ---
dotenvy = "0.15"

# --- Errors / logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Misc ---
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
mime = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
