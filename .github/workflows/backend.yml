name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  # On PRs this workflow is invoked by gate.yml (only when backend/ changed), so
  # the whole suite is a single required status check. See gate.yml.
  workflow_call:

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Used by `cargo test` (integration tests hit a real Postgres).
  DATABASE_URL: postgres://circleup:circleup@localhost:5432/circleup
  JWT_SECRET: ci-secret-not-used-in-prod-0000000000000000000000000000
  RUN_MIGRATIONS_ON_START: "false"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: circleup
          POSTGRES_PASSWORD: circleup
          POSTGRES_DB: circleup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U circleup -d circleup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        run: sqlx migrate run --source ./migrations
      - name: Test
        run: cargo test --all-targets

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build release
        run: cargo build --release --locked
